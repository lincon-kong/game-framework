name: ${COMPOSE_PROJECT_NAME:?Set a unique COMPOSE_PROJECT_NAME for each game and environment}

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${PGDATABASE:?Set PGDATABASE}
      POSTGRES_USER: ${PGUSER:?Set PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD}
    ports:
      - "127.0.0.1:${PGPORT:?Set PGPORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
