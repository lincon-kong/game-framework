name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Framework validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Repository diff
        run: git diff --check

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Client dependencies
        run: npm --prefix client ci

      - name: Client build
        run: npm --prefix client run build

      - name: Tooling syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in tooling/*.mjs tooling/lib/*.mjs; do
            node --check "$file"
          done

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false

      - name: Resolve server dependencies
        working-directory: server
        run: go mod tidy

      - name: Commit generated Go module lock
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          changes="$(git status --porcelain -- server/go.mod server/go.sum)"
          if [ -z "$changes" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/go.mod server/go.sum
          git commit -m "chore(server): lock Go dependencies"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Go module lock guard
        shell: bash
        run: |
          set -euo pipefail
          changes="$(git status --porcelain -- server/go.mod server/go.sum)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "Run 'go mod tidy' in server and commit go.mod/go.sum."
            exit 1
          fi

      - name: Server test
        working-directory: server
        run: go test ./...
